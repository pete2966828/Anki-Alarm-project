name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AnkiAlarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # A release named "latest" is the easy place to grab the APK from a phone.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AnkiAlarm.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AnkiAlarm.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from ${GITHUB_SHA::7}. Download AnkiAlarm.apk on your phone and open it to install."
